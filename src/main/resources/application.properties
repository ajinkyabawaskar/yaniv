spring.application.name=yanif

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/yanif?serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# HikariCP: the WebSocket broadcast path (loadRoomView) borrows a connection on
# EVERY game action, so unbounded defaults let one bursty table starve the pool.
# 10 covers a few concurrent tables with headroom; idle connections below 2
# are released instead of held against MySQL's max_connections (40 in prod).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
# Never hold a connection for the whole HTTP/WebSocket session: the broadcast
# path only needs it for the 3-query view load, not for rendering or timers.
spring.jpa.open-in-view=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT Configuration
app.jwt.secret=your-secret-key-change-this-in-production-min-32-chars-long-1234567890
app.jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.path=/ws
server.servlet.context-path=/

# Network Configuration - bind to all interfaces for external access
server.address=0.0.0.0
server.port=8080

# Tomcat: this box hosts a few concurrent tables, not hundreds of clients.
# Capping worker threads bounds native stack memory and context switching;
# 50 still absorbs message bursts (STOMP fan-out is non-blocking sends).
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=50

# Application Version - increment on each release
app.version=2.0.14

# Turn timer / auto-play: when a DISCONNECTED player's turn timer expires, the
# server plays the best available move on their behalf so the game keeps flowing.
# Connected players are never auto-played and get unlimited thinking time.
game.turn-timer-seconds=45
game.auto-play-enabled=true
# Seconds other players have to contest (Asaf) a Yaniv call
game.yaniv-contest-timer-seconds=5
# Maximum hand score for which calling Yaniv is legal
game.yaniv-threshold=7

# Rooms nobody has touched for this long are dropped from memory.
# Rounds are short and every action touches the room, so a few idle minutes
# means the table is genuinely done. State survives in the Redis snapshot and
# is restored transparently if anyone does come back.
game.engine-idle-eviction-minutes=5

# How long an absent player's turn is held before the server plays it for them.
# Counted only while it is their turn, and granted once per absence: later turns in
# the same absence are played quickly so the table is not held up repeatedly.
game.absence-grace-seconds=45

# Pace of later turns in the same absence, once the grace above is spent. Low keeps the
# table moving; too low and a whole game finishes while someone's phone is locked.
game.spent-grace-delay-ms=800

# How long a matching-rank bonus decision is held before the server declines it. Unlike
# the grace above this applies to everyone, connected or not: the decision blocks the
# whole room, and declining costs the player nothing -- they keep the card they drew.
# It is a backstop for a client that cannot answer, not a game clock, so it is long
# enough that a player reading an unfamiliar prompt never races it. The panel shows the
# countdown, so it is never a surprise.
game.bonus-discard-timeout-seconds=30

# Knocked-out players see how close each remaining player is to Yaniv and to
# elimination. Derived from hidden hands, so it is only ever sent to a player who
# is out; set false to switch the meters off entirely.
game.spectator-meters-enabled=true

# Idle auto-play cap: a room where every active player is absent self-advances via
# auto-play (turn timers + round-over advance), each bot move costing a Redis write,
# a MySQL insert and a broadcast. These bound how far an all-absent room may run
# before it is parked: at most this many consecutive fully-auto rounds, or this
# many minutes of continuous all-absence, whichever hits first. Parking cancels the
# room's timers and evicts its engine with the snapshot kept, so the next human
# touch restores it via the normal path and play continues. Any human action in
# the room restarts both budgets. Rooms with even one connected active player are
# never affected. Either cap is disabled by setting it to 0.
game.max-idle-auto-rounds=20
game.max-idle-auto-minutes=30
