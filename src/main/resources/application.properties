spring.application.name=yanif

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/yanif
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
# spring.jpa.properties.hibernate.implicit_naming_strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# JWT Configuration
app.jwt.secret=your-secret-key-change-this-in-production-min-32-chars-long-1234567890
app.jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.path=/ws
server.servlet.context-path=/

# Network Configuration - bind to all interfaces for external access
server.address=0.0.0.0
server.port=8080

# Application Version - increment on each release
app.version=1.3.6

# Turn timer / auto-play: when a DISCONNECTED player's turn timer expires, the
# server plays the best available move on their behalf so the game keeps flowing.
# Connected players are never auto-played and get unlimited thinking time.
game.turn-timer-seconds=45
game.auto-play-enabled=false
# Seconds other players have to contest (Asaf) a Yaniv call
game.yaniv-contest-timer-seconds=15
# Maximum hand score for which calling Yaniv is legal
game.yaniv-threshold=7
